name: Bug report
description: Report a reproducible defect in Wardroom.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing. For a security vulnerability, stop and follow SECURITY.md instead of posting details here.
  - type: checkboxes
    id: existing
    attributes:
      label: Existing issue
      options:
        - label: I searched the open and closed issues for this defect.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Give the exact release version or source commit that you tested.
      placeholder: 0.1.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - TypeScript daemon
        - macOS runtime host
        - Installation or service lifecycle
        - Protocol or persistence
        - Build, CI, or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: State what happened, including the exact bounded error when one exists.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the result or boundary you expected Wardroom to preserve.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Prefer fake IDs and a new temporary ROOMS_STATE_DIR. Never upload installed state; if the defect occurs only there, say so and redact the setup.
      placeholder: |
        1. export ROOMS_STATE_DIR="$(mktemp -d /tmp/rooms-repro.XXXXXX)"
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS and architecture:
        - Node.js version:
        - Go version, if relevant:
        - Source checkout or installed release:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Optional short logs or screenshots. Remove credentials, message bodies, real IDs, paths, hosts, and transcripts.
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I did not attach real Wardroom state and removed secrets, real identities, private paths, host details, message data, and transcripts.
          required: true
